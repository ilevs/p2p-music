# Built on top of detekt's default config with `allRules = true` in
# app/build.gradle.kts, so every rule (including the ones detekt ships
# disabled) is active. Only deliberate exceptions live here.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true
  excludes: 'Compose.*'

comments:
  # KDoc on every public declaration of an app is noise, not safety.
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120

Compose:
  ModifierMissing:
    active: true
  ViewModelForwarding:
    active: true
