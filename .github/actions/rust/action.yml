name: Rust for Android
description: Toolchain, Android targets and cargo-ndk for the Soulseek library in native/soulseek
runs:
  using: composite
  steps:
    - name: Install Android targets and cargo-ndk
      shell: bash
      run: |
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        cargo install cargo-ndk --version 4.1.2 --locked

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/soulseek
