name: Rust for Android
description: Toolchain, Android targets and cargo-ndk for the Soulseek library in native/soulseek
runs:
  using: composite
  steps:
    # The toolchain and Android targets come from native/soulseek/rust-toolchain.toml on first use.
    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --version 4.1.2 --locked

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: native/soulseek
