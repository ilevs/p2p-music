name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt
        if: ${{ !cancelled() }}
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug lintRelease --continue

      - name: Print lint issues
        if: ${{ failure() }}
        run: cat app/build/reports/lint-results-*.txt 2>/dev/null || true

      - name: Unit tests
        if: ${{ !cancelled() }}
        env:
          # Optional: RuTrackerLiveTest runs against the real site only when these secrets exist.
          RUTRACKER_LOGIN: ${{ secrets.RUTRACKER_LOGIN }}
          RUTRACKER_PASSWORD: ${{ secrets.RUTRACKER_PASSWORD }}
          # LiveStreamTest streams a public torrent from the real swarm. PRs only: the swarm sometimes
          # gives a runner no peers for minutes, and that must not block the release of merged code.
          LIVE_TESTS: ${{ github.event_name == 'pull_request' }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
