name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/rust

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK is signed with the debug key."
          fi

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ env.VERSION_NAME }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=app/build/outputs/apk/release
          cp "$out/app-universal-release.apk" "peerlude-${VERSION_NAME}.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "$out/app-${abi}-release.apk" "peerlude-${VERSION_NAME}-${abi}.apk"
          done
          gh release create "v${VERSION_NAME}" peerlude-*.apk \
            --target "$GITHUB_SHA" \
            --title "v${VERSION_NAME}" \
            --generate-notes
