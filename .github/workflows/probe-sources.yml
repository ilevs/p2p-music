name: probe-sources
on:
  push:
    branches: [claude/project-thread-5kb6mz]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u tools/probe_index.py | tee probe.txt
      - run: grep '^METRIC' probe.txt >> "$GITHUB_STEP_SUMMARY" || true
