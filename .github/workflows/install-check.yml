name: Install check

# Installs the release APK on emulators and launches it, so an APK that Android refuses
# to install or that crashes on start never reaches a phone or a head unit.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/rust

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Check that native libraries are stored and 16 KB aligned
        run: |
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$zipalign" -c -P 16 4 "$apk" && echo "aligned: $apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-universal-release.apk

  # Built once and shared: parallel Gradle builds get rate-limited by Maven Central.
  install:
    name: Install, launch, play (API ${{ matrix.api }} ${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: '27', target: default }  # Android 8.1 head units such as Haval Jolion
          - { api: '35', target: google_apis }
          - { api: '36', target: google_apis }
          - { api: '37.0', target: google_apis }
          # Android 17 on Pixel phones runs with 16 KB memory pages.
          - { api: '37.1', target: google_apis_ps16k }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Download the latest published APK for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern 'p2p-music-*[0-9].apk' --output published.apk || true

      - name: List system images for this API level
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -E "system-images;android-${{ matrix.api }}" | head -20 || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the test seeder
        run: sudo apt-get install -y python3-libtorrent

      - name: Install and launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOULSEEK_PASSWORD: ${{ secrets.SOULSEEK_PASSWORD }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: bash .github/scripts/install-check.sh app-universal-release.apk published.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.api }}-${{ matrix.target }}
          path: screen-*.png
          if-no-files-found: ignore

  # Android TV with the remote only: in the TV launcher, then search, play, pause, seek and settings by D-pad.
  # 32-bit x86, like many TV boxes are 32-bit (theirs is armeabi-v7a, which the emulator cannot run fast).
  tv:
    name: Android TV by remote (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: ['30']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: List Android TV system images
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -E "android-tv" | head -20 || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the app by remote on the Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          target: android-tv
          disable-animations: true
          script: bash .github/scripts/tv-check.sh app-universal-release.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-tv-${{ matrix.api }}
          path: screen-*.png
          if-no-files-found: ignore
